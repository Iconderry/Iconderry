<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <title>Iconderry - Free Vector Icons, SVG Studio & Custom Asset Generator</title>
    <meta name="description" content="Discover, customize, and export thousands of high-quality vector icons with live 3D effects, gradient filters, colors, and background badges." />
    <meta name="theme-color" content="#ffffff" />

    <!-- Google Fonts for Pro 3D Typography & Canvas Elements -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Cinzel:wght@600;800&family=Fredoka:wght@600;700&family=Inter:wght@400;600;800&family=Montserrat:wght@500;700;900&family=Orbitron:wght@600;800;900&family=Outfit:wght@400;600;800&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:ital,wght@0,700;1,700&family=Righteous&family=Russo+One&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://iconderry.vercel.app/" />
    <meta property="og:title" content="Iconderry - Pro Vector Studio & Free Icon Library" />
    <meta property="og:description" content="Customize, style, and download production-ready SVG & PNG vector icons with live material effects, filters, and background tiles." />
    <meta property="og:image" content="/app-icon.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Iconderry - Pro Vector Studio & Free Icon Library" />
    <meta property="twitter:description" content="Customize, style, and download production-ready SVG & PNG vector icons with live material effects, filters, and background tiles." />
    <meta property="twitter:image" content="/app-icon.png" />

    <!-- Web App Manifest for Browser App Download & Home Screen Icon -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="application-name" content="Iconderry" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Iconderry" />

    <!-- Favicons and Installed App Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="shortcut icon" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png" />
    <!-- Immediate synchronous detection of Native Capacitor APK to prevent status-bar overlap -->
    <script>
      (function() {
        var isCap = Boolean(
          window.AndroidNativeDownloader ||
          window.Capacitor ||
          window.location.protocol === 'capacitor:' ||
          /wv|Capacitor/i.test(navigator.userAgent) ||
          (window.location.hostname === 'localhost' && /Android/i.test(navigator.userAgent))
        );
        if (isCap) {
          window.IS_NATIVE_CAPACITOR = true;
          document.documentElement.classList.add('is-native-capacitor');
        }

        // Prevent multi-touch browser pinch-to-zoom so it behaves exactly like a native app
        window.addEventListener('touchstart', function(e) {
          if (e.touches && e.touches.length > 1) {
            e.preventDefault();
          }
        }, { passive: false });

        window.addEventListener('touchmove', function(e) {
          if (e.touches && e.touches.length > 1) {
            e.preventDefault();
          }
        }, { passive: false });

        window.addEventListener('gesturestart', function(e) {
          e.preventDefault();
        });
        window.addEventListener('gesturechange', function(e) {
          e.preventDefault();
        });
        window.addEventListener('gestureend', function(e) {
          e.preventDefault();
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
