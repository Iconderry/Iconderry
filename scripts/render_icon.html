<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1024px;
    height: 1024px;
    background: transparent !important;
    overflow: hidden;
  }
  svg {
    width: 1024px;
    height: 1024px;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4c1d95"/>
      <stop offset="0.45" stop-color="#2e1065"/>
      <stop offset="0.75" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glassDiamondGrad" x1="40" y1="40" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="0.3" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#9333ea" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="prismRainbow" x1="60" y1="60" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22c55e"/>
      <stop offset="0.3" stop-color="#eab308"/>
      <stop offset="0.65" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glassGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Squircle with clean 22% golden-ratio radius -->
  <rect width="200" height="200" rx="44" fill="url(#bgGrad)"/>
  <!-- Subtle inner border stroke for premium glass bevel -->
  <rect x="1" y="1" width="198" height="198" rx="43" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15"/>
  <!-- Outer Glass Diamond Cushion -->
  <rect x="36" y="36" width="128" height="128" rx="38" transform="rotate(45 100 100)" fill="url(#glassDiamondGrad)" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.85" filter="url(#glassGlow)"/>
  <!-- Specular Top Reflection -->
  <path d="M 64 64 C 84 44 116 44 136 64 C 110 75 90 75 64 64 Z" fill="#ffffff" fill-opacity="0.45"/>
  <!-- Inner Rainbow Spectrum Diamond Core -->
  <rect x="58" y="58" width="84" height="84" rx="22" transform="rotate(45 100 100)" fill="url(#prismRainbow)"/>
  <!-- Vector Coordinate Crosshair & Nodes -->
  <line x1="52" y1="100" x2="148" y2="100" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <line x1="100" y1="52" x2="100" y2="148" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="52" cy="100" r="4.5" fill="#ffffff"/>
  <circle cx="148" cy="100" r="4.5" fill="#ffffff"/>
  <circle cx="100" cy="52" r="4.5" fill="#ffffff"/>
  <circle cx="100" cy="148" r="4.5" fill="#ffffff"/>
</svg>
</body>
</html>
